<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f4f2ed; color: #15161a; font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 12px; background: #0e0f13; color: #f4f2ed; text-decoration: none; font-weight: 500; }
  h1 { font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
  p { color: #5d5f66; margin: 0 0 24px; }
</style>
</head>
<body>
  <main>
    <h1>This page is not here</h1>
    <p>The link may be old. The shop is one tap away.</p>
    <a href="./">Go to the shop</a>
  </main>
  <script>
    /* GitHub Pages serves this for any missing path; send visitors to the store folder home */
    (function () { var base = location.pathname.split('/').filter(Boolean)[0]; if (base && !/\.html$/.test(base)) document.querySelector('a').href = '/' + base + '/'; })();
  </script>
</body>
</html>
